<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Browser</title>
<link rel="icon" type="image/png" href="aurora.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    background: #2b2a33;
    background-image: linear-gradient(180deg, #1c1b22 0%, #2b2a33 40%);
    color: #fbfbfe;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }

  /* top bar */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    padding: 12px 16px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
  }

  .gear-btn {
    background: none;
    border: none;
    color: #8f8f9d;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gear-btn:hover {
    background: rgba(255,255,255,0.08);
    color: #fbfbfe;
  }

  .gear-btn svg {
    width: 20px;
    height: 20px;
  }

  /* main content */
  .main {
    width: 100%;
    max-width: 900px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10vh;
  }

  /* logo */
  .logo {
    width: 92px;
    height: 92px;
    border-radius: 22px;
    margin-bottom: 16px;
    object-fit: cover;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
  }

  /* search */
  .search {
    width: 100%;
    max-width: 560px;
    position: relative;
    margin-bottom: 40px;
  }

  .search input {
    width: 100%;
    padding: 12px 48px 12px 16px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fbfbfe;
    font-size: 15px;
    outline: none;
    transition: background 0.2s;
  }

  .search input::placeholder {
    color: #8f8f9d;
  }

  .search input:focus {
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 0 2px rgba(122,86,233,0.5);
  }

  .search-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: #8f8f9d;
    pointer-events: none;
  }

  /* shortcuts */
  .shortcuts-section {
    width: 100%;
    max-width: 600px;
    margin-bottom: 32px;
  }

  .shortcuts-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .shortcuts-header h2 {
    font-size: 13px;
    font-weight: 600;
    color: #bfbfc8;
    letter-spacing: 0.2px;
  }

  .shortcuts-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    padding: 10px 4px;
    border-radius: 8px;
    transition: background 0.15s;
  }

  .shortcut:hover {
    background: rgba(255,255,255,0.06);
  }

  .shortcut-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .shortcut-icon img {
    border-radius: 8px;
  }

  .shortcut-name {
    font-size: 11px;
    color: #bfbfc8;
    text-align: center;
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* stories section */
  .stories-section {
    width: 100%;
    max-width: 860px;
    margin-bottom: 40px;
  }

  .stories-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .stories-header h2 {
    font-size: 13px;
    font-weight: 600;
    color: #bfbfc8;
    letter-spacing: 0.2px;
  }

  .stories-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .story {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 14px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s, transform 0.15s;
    display: flex;
    flex-direction: column;
    min-height: 160px;
  }

  .story:hover {
    background: rgba(255,255,255,0.07);
    transform: translateY(-1px);
  }

  .story-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .story-title {
    font-size: 13px;
    font-weight: 600;
    color: #fbfbfe;
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .story-source {
    font-size: 11px;
    color: #8f8f9d;
  }

  /* theme picker */
  .picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .picker-overlay.open {
    display: flex;
  }

  .picker {
    background: #2b2a33;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 24px;
    width: 360px;
    max-width: 92vw;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  }

  .picker h3 {
    font-size: 15px;
    font-weight: 600;
    color: #fbfbfe;
    margin-bottom: 16px;
  }

  .picker label {
    display: block;
    font-size: 12px;
    color: #8f8f9d;
    margin-top: 14px;
    margin-bottom: 4px;
  }

  .picker input[type="color"] {
    width: 100%;
    height: 34px;
    border: none;
    background: none;
    cursor: pointer;
    border-radius: 6px;
  }

  .picker input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fbfbfe;
    font-size: 13px;
  }

  .picker-btns {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .picker-btns button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  .picker-btns .ok {
    background: #7a56e9;
    color: #fff;
  }

  .picker-btns .cancel {
    background: rgba(255,255,255,0.08);
    color: #bfbfc8;
  }

  /* footer */
  .footer {
    width: 100%;
    padding: 16px 20px;
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: auto;
    padding-bottom: 20px;
  }

  .footer a {
    font-size: 12px;
    color: #5a5a6e;
    text-decoration: none;
    transition: color 0.15s;
  }

  .footer a:hover {
    color: #bfbfc8;
  }

  @media (max-width: 600px) {
    .shortcuts-grid { grid-template-columns: repeat(4, 1fr); }
    .stories-grid { grid-template-columns: repeat(2, 1fr); }
    .main { margin-top: 6vh; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <button class="gear-btn" id="gearBtn" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>
</div>

<div class="main">
  <img id="logo" src="" alt="Aurora" class="logo" draggable="false">

  <form class="search" action="https://www.google.com/search" method="GET" target="_top">
    <input type="text" name="q" placeholder="Search the web" autofocus>
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </form>

  <div class="shortcuts-section">
    <div class="shortcuts-header">
      <h2>Shortcuts</h2>
    </div>
    <div class="shortcuts-grid" id="shortcuts"></div>
  </div>

  <div class="stories-section">
    <div class="stories-header">
      <h2>Recommended</h2>
    </div>
    <div class="stories-grid" id="stories"></div>
  </div>
</div>

<div class="footer">
  <a href="https://github.com/Draftiermovie66/Aurora-Browser/releases" target="_blank">Releases</a>
  <a href="https://github.com/Draftiermovie66/Aurora-Browser/issues" target="_blank">Report Issue</a>
  <a href="https://github.com/Draftiermovie66/Aurora-Browser" target="_blank">Source</a>
</div>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker">
    <h3>New Tab Settings</h3>
    <label>Background color</label>
    <input type="color" id="pBg" value="#2b2a33">
    <label>Text color</label>
    <input type="color" id="pTxt" value="#fbfbfe">
    <label>Accent color</label>
    <input type="color" id="pAcc" value="#7a56e9">
    <label>Background image URL</label>
    <input type="text" id="pImg" placeholder="optional">
    <div class="picker-btns">
      <button class="ok" id="pickerOk">Done</button>
      <button class="cancel" id="pickerCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
var SHORTCUTS = [
  { name: 'YouTube',    url: 'https://youtube.com' },
  { name: 'GitHub',     url: 'https://github.com' },
  { name: 'Reddit',     url: 'https://reddit.com' },
  { name: 'Wikipedia',  url: 'https://wikipedia.org' },
  { name: 'Gmail',      url: 'https://mail.google.com' },
  { name: 'X',          url: 'https://x.com' },
  { name: 'Amazon',     url: 'https://amazon.com' },
  { name: 'Twitter',    url: 'https://twitter.com' },
  { name: 'Netflix',    url: 'https://netflix.com' },
  { name: 'Stack Overflow', url: 'https://stackoverflow.com' },
  { name: 'Discord',    url: 'https://discord.com' },
  { name: 'Twitch',     url: 'https://twitch.tv' },
];

function getFaviconUrl(domain) {
  return 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=64';
}

function extractDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch(e) { return url; }
}

var logo = document.getElementById('logo');
if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.getURL) {
  logo.src = chrome.runtime.getURL('aurora.png');
} else {
  logo.src = 'aurora.png';
}

var shortcutsEl = document.getElementById('shortcuts');
SHORTCUTS.forEach(function(s) {
  var domain = extractDomain(s.url);
  var a = document.createElement('a');
  a.className = 'shortcut';
  a.href = s.url;
  a.target = '_top';
  a.innerHTML = '<div class="shortcut-icon"><img src="' + getFaviconUrl(domain) + '" width="32" height="32" style="border-radius:6px" alt="' + s.name + '"></div><span class="shortcut-name">' + s.name + '</span>';
  shortcutsEl.appendChild(a);
});

fetch('https://api.github.com/repos/Draftiermovie66/Aurora-Browser/releases/latest')
  .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
  .then(function(data) {
    var stories = document.getElementById('stories');
    var tag = data.tag_name;
    var body = data.body || '';

    var card = document.createElement('a');
    card.className = 'story';
    card.href = 'https://github.com/Draftiermovie66/Aurora-Browser/releases';
    card.target = '_blank';
    card.innerHTML = '<div class="story-body"><div class="story-title">' + tag + ' is out</div><div class="story-source">Aurora Browser</div></div>';
    stories.appendChild(card);

    var lines = body.split('\n').filter(function(l) { return l.trim() && !l.startsWith('#'); });
    lines.slice(0, 3).forEach(function(line) {
      var c = document.createElement('a');
      c.className = 'story';
      c.href = 'https://github.com/Draftiermovie66/Aurora-Browser/releases';
      c.target = '_blank';
      c.innerHTML = '<div class="story-body"><div class="story-title">' + line.replace(/^[-*]\s*/, '').substring(0, 60) + '</div><div class="story-source">' + tag + '</div></div>';
      stories.appendChild(c);
    });

    if (lines.length === 0) {
      var fallback = document.createElement('a');
      fallback.className = 'story';
      fallback.href = 'https://github.com/Draftiermovie66/Aurora-Browser';
      fallback.target = '_blank';
      fallback.innerHTML = '<div class="story-body"><div class="story-title">Aurora Browser</div><div class="story-source">Chromium-based &bull; Auto-updating</div></div>';
      stories.appendChild(fallback);
    }
  })
  .catch(function() {
    var s = document.getElementById('stories');
    var c = document.createElement('a');
    c.className = 'story';
    c.href = 'https://github.com/Draftiermovie66/Aurora-Browser';
    c.target = '_blank';
    c.innerHTML = '<div class="story-body"><div class="story-title">Aurora Browser</div><div class="story-source">Chromium-based &bull; Auto-updating &bull; Private</div></div>';
    s.appendChild(c);
  });

var THEMES = [
  { id: 'default',  bg: '#2b2a33', txt: '#fbfbfe', accent: '#7a56e9', img: '' },
  { id: 'blue',     bg: '#1a2435', txt: '#e0eaf5', accent: '#3b82f6', img: '' },
  { id: 'green',    bg: '#1a2e20', txt: '#e0f0e0', accent: '#22c55e', img: '' },
  { id: 'red',      bg: '#2e1a1a', txt: '#f0e0e0', accent: '#ef4444', img: '' },
  { id: 'orange',   bg: '#2e261a', txt: '#f0eae0', accent: '#f59e0b', img: '' },
  { id: 'light',    bg: '#f0f0f0', txt: '#1a1a1a', accent: '#7a56e9', img: '' },
  { id: 'midnight', bg: '#121212', txt: '#a0a0a0', accent: '#a855f7', img: '' },
];

function applyTheme(t) {
  var b = document.body;
  if (t.img) {
    b.style.backgroundImage = 'url(' + t.img + ')';
    b.style.background = '';
    b.style.backgroundImage = 'url(' + t.img + ')';
    b.style.backgroundSize = 'cover';
    b.style.backgroundPosition = 'center';
    b.style.backgroundRepeat = 'no-repeat';
  } else {
    b.style.backgroundImage = 'none';
    b.style.background = 'linear-gradient(180deg, ' + shade(t.bg, -0.2) + ' 0%, ' + t.bg + ' 40%)';
  }
  b.style.color = t.txt;
  document.querySelector('.search input').style.background = 'rgba(255,255,255,0.08)';
  document.querySelector('.search input').style.color = t.txt;
  document.querySelector('.search input').style.setProperty('--focus-ring', t.accent);

  var shortcuts = document.querySelectorAll('.shortcut-icon');
  for (var i = 0; i < shortcuts.length; i++) {
    shortcuts[i].style.background = 'rgba(255,255,255,0.07)';
  }

  var stories = document.querySelectorAll('.story');
  for (var j = 0; j < stories.length; j++) {
    stories[j].style.background = 'rgba(255,255,255,0.04)';
  }

  var dots = document.querySelectorAll('.theme-swatch');
  for (var k = 0; k < dots.length; k++) {
    dots[k].classList.toggle('active', dots[k].dataset.id === t.id);
  }
}

function shade(hex, pct) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.substr(0,2),16);
  var g = parseInt(hex.substr(2,2),16);
  var b = parseInt(hex.substr(4,2),16);
  r = Math.min(255, Math.max(0, Math.round(r + r * pct)));
  g = Math.min(255, Math.max(0, Math.round(g + g * pct)));
  b = Math.min(255, Math.max(0, Math.round(b + b * pct)));
  return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function buildThemes() {
  var el = document.getElementById('shortcuts-header');
  var existing = el.querySelector('.theme-swatches');
  if (existing) existing.remove();

  var wrap = document.createElement('div');
  wrap.className = 'theme-swatches';
  wrap.style.cssText = 'display:flex;gap:6px;align-items:center;';

  var active = 'default';
  try { active = JSON.parse(localStorage.getItem('aurora-theme')).id || 'default'; } catch(e) {}

  THEMES.forEach(function(t) {
    var s = document.createElement('div');
    s.className = 'theme-swatch' + (t.id === active ? ' active' : '');
    s.dataset.id = t.id;
    s.title = t.id;
    s.style.cssText = 'width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;background:' + t.bg + ';transition:border-color 0.15s,transform 0.15s;flex-shrink:0;';
    s.onclick = function() {
      localStorage.setItem('aurora-theme', JSON.stringify(t));
      applyTheme(t);
      buildThemes();
    };
    wrap.appendChild(s);
  });

  el.appendChild(wrap);

  var saved = localStorage.getItem('aurora-theme');
  if (saved) { try { applyTheme(JSON.parse(saved)); } catch(e) {} }
}

document.getElementById('gearBtn').onclick = function() {
  var saved;
  try { saved = JSON.parse(localStorage.getItem('aurora-theme')); } catch(e) {}
  if (saved) {
    if (saved.bg && saved.bg.charAt(0) === '#') document.getElementById('pBg').value = saved.bg;
    if (saved.txt && saved.txt.charAt(0) === '#') document.getElementById('pTxt').value = saved.txt;
    if (saved.accent && saved.accent.charAt(0) === '#') document.getElementById('pAcc').value = saved.accent;
    document.getElementById('pImg').value = saved.img || '';
  }
  document.getElementById('pickerOverlay').classList.add('open');
};

document.getElementById('pickerCancel').onclick = function() {
  document.getElementById('pickerOverlay').classList.remove('open');
};

document.getElementById('pickerOk').onclick = function() {
  var t = {
    id: 'custom',
    bg: document.getElementById('pBg').value,
    txt: document.getElementById('pTxt').value,
    accent: document.getElementById('pAcc').value,
    img: document.getElementById('pImg').value,
  };
  localStorage.setItem('aurora-theme', JSON.stringify(t));
  applyTheme(t);
  buildThemes();
  document.getElementById('pickerOverlay').classList.remove('open');
};

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') document.getElementById('pickerOverlay').classList.remove('open');
});

buildThemes();
</script>
</body>
</html>
