name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    name: Build React extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build
        working-directory: extension
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/

  lint-shell-scripts:
    name: Check bash scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          set -e
          shopt -s globstar nullglob
          for f in build.sh release.sh scripts/build/*.sh packages/**/*.sh; do
            if [ -f "$f" ]; then
              bash -n "$f"
              echo "OK: $f"
            fi
          done
          # Also check root shims resolve
          bash -n build.sh && echo "OK: build.sh (shim)"
          bash -n release.sh && echo "OK: release.sh (shim)"

  validate-versions:
    name: Validate VERSION sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version sync
        run: |
          VER=$(cat VERSION | tr -d ' \n\r')
          EXT_VER=$(node -p "require('./extension/package.json').version")
          PKG_VER=$(grep '^pkgver=' packages/linux/arch/PKGBUILD | cut -d= -f2)
          echo "VERSION=$VER extension=$EXT_VER PKGBUILD=$PKG_VER"
          if [ "$VER" != "$EXT_VER" ] || [ "$VER" != "$PKG_VER" ]; then
            echo "::error::Version drift detected"
            exit 1
          fi
          echo "Version sync OK: $VER"
