name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          set -e
          FAIL=0
          find . -name "*.sh" -not -path "./.git/*" -not -path "*/node_modules/*" | while read f; do
            if bash -n "$f" 2>/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              FAIL=1
            fi
          done
          exit $FAIL

  check-version:
    name: Validate VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION file
        run: |
          VER=$(cat VERSION | tr -d ' \n\r')
          echo "VERSION=$VER"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VER' does not match X.Y.Z pattern"
            exit 1
          fi
          echo "Version OK"

  validate-workflows:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YAML syntax
        run: |
          pip install pyyaml -q 2>/dev/null || true
          python3 -c "
          import yaml, sys, glob
          ok = True
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f))
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  ok = False
          if not ok:
              sys.exit(1)
          "

  build-engine-check:
    name: Verify Ladybird clone + brand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Ladybird (shallow)
        run: |
          git clone --depth 1 https://github.com/LadybirdBrowser/ladybird.git /tmp/ladybird
          echo "Ladybird cloned OK"

      - name: Apply branding (dry run)
        run: |
          VERSION="0.0.0-test" bash ./engine/brand.sh /tmp/ladybird
          echo "Branding OK"
