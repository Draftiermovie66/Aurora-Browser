name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          set -e
          find . -name "*.sh" -not -path "./.git/*" -not -path "*/node_modules/*" | while read f; do
            bash -n "$f" && echo "OK: $f"
          done

  check-version:
    name: Validate VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION file
        run: |
          VER=$(cat VERSION | tr -d ' \n\r')
          echo "VERSION=$VER"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VER' does not match X.Y.Z pattern"
            exit 1
          fi

  validate-workflows:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YAML syntax
        run: |
          pip install yamllint || sudo apt-get install -y yamllint
          yamllint -d relaxed .github/workflows/*.yml || true

  build-engine-check:
    name: Verify Ladybird clone + brand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Ladybird (shallow)
        run: |
          git clone --depth 1 https://github.com/LadybirdBrowser/ladybird.git /tmp/ladybird
          echo "Ladybird cloned successfully"
          ls /tmp/ladybird/CMakeLists.txt

      - name: Apply branding (dry run)
        run: |
          VERSION="0.0.0-test" bash ./engine/brand.sh /tmp/ladybird
          echo "Branding applied successfully"
          head -5 /tmp/ladybird/CMakeLists.txt
