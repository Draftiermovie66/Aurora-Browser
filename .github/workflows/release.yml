name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  LADYBIRD_REPO: "https://github.com/LadybirdBrowser/ladybird.git"
  LADYBIRD_BRANCH: "main"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag & version
        id: parse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Tag: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-.*)?$ ]]; then
            echo "::error::Tag '$TAG' does not match v*.*(*) pattern"
            exit 1
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Release: \`$TAG\` (v$VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify VERSION matches tag
        run: |
          FILE_VER="$(cat VERSION | tr -d ' \n\r')"
          TAG_VER="${{ steps.parse.outputs.version }}"
          if [ "$FILE_VER" != "$TAG_VER" ]; then
            echo "::error::VERSION file ($FILE_VER) != tag ($TAG_VER)"
            exit 1
          fi
          echo "Version sync OK: $FILE_VER"

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update && sudo apt-get install -y pigz
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld cmake ninja-build \
            git rustup pkg-config autoconf autoconf-archive automake nasm \
            qt6-base-dev qt6-tools-dev-tools qt6-wayland \
            libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libssl-dev \
            zip unzip tar curl ccache python3

      - name: Setup Rust
        run: |
          rustup default stable || true
          rustup update || true

      - name: Clone Ladybird
        run: |
          git clone --depth 1 --branch ${{ env.LADYBIRD_BRANCH }} \
            ${{ env.LADYBIRD_REPO }} build/ladybird

      - name: Apply Aurora branding
        run: VERSION=${{ needs.check-version.outputs.version }} bash ./engine/brand.sh build/ladybird

      - name: Build Ladybird (Release)
        working-directory: build/ladybird
        run: BUILD_PRESET=Release ./Meta/ladybird.py build

      - name: Package Aurora Browser
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/package.sh build/ladybird \
            build/aurora-browser-${VERSION}-linux $VERSION

      - name: Generate checksums
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/checksums.sh build $VERSION

      - name: Create tarball
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          cd build
          tar -czf aurora-browser-${VERSION}-linux-x86_64.tar.gz \
            aurora-browser-${VERSION}-linux/

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/aurora-browser-*-linux/
            build/aurora-browser-*-linux-x86_64.tar.gz
            build/checksums-SHA256-*.txt

  build-macos:
    needs: check-version
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install autoconf autoconf-archive automake ccache cmake \
            libtool nasm ninja pkg-config
          brew install llvm@21 || true

      - name: Clone Ladybird
        run: |
          git clone --depth 1 --branch ${{ env.LADYBIRD_BRANCH }} \
            ${{ env.LADYBIRD_REPO }} build/ladybird

      - name: Apply Aurora branding
        run: VERSION=${{ needs.check-version.outputs.version }} bash ./engine/brand.sh build/ladybird

      - name: Build Ladybird (Release)
        working-directory: build/ladybird
        run: |
          if [ -d "$(brew --prefix llvm 2>/dev/null || echo /nonexistent)" ]; then
            export CC="$(brew --prefix llvm)/bin/clang"
            export CXX="$(brew --prefix llvm)/bin/clang++"
          fi
          BUILD_PRESET=Release ./Meta/ladybird.py build

      - name: Package Aurora Browser
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/package.sh build/ladybird \
            build/aurora-browser-${VERSION}-macos $VERSION

      - name: Code sign (ad-hoc)
        run: |
          APP=$(find build -name "Aurora Browser.app" -type d | head -n1)
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP" 2>/dev/null || true
            echo "Ad-hoc signed: $APP"
          fi

      - name: Create DMG
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          APP=$(find build -name "Aurora Browser.app" -type d | head -n1)
          if [ -n "$APP" ]; then
            hdiutil create -volname "Aurora Browser" \
              -srcfolder "$APP" -ov -format UDZO \
              "build/Aurora-Browser-${VERSION}-macOS.dmg"
            echo "DMG created"
          fi

      - name: Generate checksums
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/checksums.sh build $VERSION

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            build/aurora-browser-*-macos/
            build/Aurora-Browser-*-macOS.dmg
            build/checksums-SHA256-*.txt

  build-windows:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build info
        run: |
          echo "::notice::Native Windows builds require WSL2."
          echo "Windows support is experimental. Building docs package."
          VERSION=${{ needs.check-version.outputs.version }}
          mkdir -p build/aurora-browser-${VERSION}-windows
          cat > build/aurora-browser-${VERSION}-windows/README.txt <<EOF
          Aurora Browser v${VERSION} for Windows
          =====================================

          Windows builds require WSL2 (Windows Subsystem for Linux).
          See: https://ladybird.org/building

          To build from source on Windows:
          1. Install WSL2 with Ubuntu 24.04+
          2. Follow the Linux build instructions
          3. The binary will work natively on Windows

          Alternatively, use the Linux build inside WSL2.
          EOF

      - name: Generate checksums
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          bash ./engine/checksums.sh build $VERSION

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/aurora-browser-*-windows/
            build/checksums-SHA256-*.txt

  create-release:
    needs: [check-version, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List release assets
        run: find . -maxdepth 4 -type f | grep -v '.git' | sort

      - name: Generate combined checksums
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          cat > checksums-SHA256-${VERSION}.txt <<EOF
          # Aurora Browser v${VERSION} — SHA256 Checksums
          # Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
          find . -maxdepth 4 -type f \
            \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" \
               -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.AppImage" \) | sort | while read -r f; do
            [ -f "$f" ] || continue
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$hash  $(basename "$f")" >> checksums-SHA256-${VERSION}.txt
          done
          cat checksums-SHA256-${VERSION}.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Aurora Browser ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Aurora Browser ${{ needs.check-version.outputs.tag }}

            Built on the **[Ladybird](https://ladybird.org) LibWeb engine**.
            No Chromium. No Firefox. Custom open-source engine.

            ### What's new
            - Custom LibWeb-based rendering engine (BSD-2-Clause)
            - Aurora Browser new-tab page
            - Privacy-respecting defaults
            - Cross-platform support (Linux, macOS)

            ### Downloads

            **Linux:**
            - `aurora-browser-${{ needs.check-version.outputs.version }}-linux-x86_64.tar.gz`
            - Extract and run `./ladybird`

            **macOS:**
            - `Aurora-Browser-${{ needs.check-version.outputs.version }}-macOS.dmg`
            - Open DMG, drag to Applications

            **Windows:**
            - Build from source using WSL2 (see README.txt)

            ### Verify downloads
            See `checksums-SHA256-${{ needs.check-version.outputs.version }}.txt`

            ### Build from source
            ```bash
            git clone https://github.com/Draftiermovie66/Aurora-Browser
            cd Aurora-Browser
            VERSION=${{ needs.check-version.outputs.version }} bash engine/build.sh
            ```

            ---
            **Engine:** LibWeb (Ladybird) — BSD-2-Clause
            **Browser:** Aurora Browser — MIT
          files: |
            checksums-SHA256-${{ needs.check-version.outputs.version }}.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
