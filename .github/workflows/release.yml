name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      has_version: ${{ steps.check.outputs.has_version }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version from commit message
        id: check
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          if [[ "$MSG" =~ [Vv]([0-9]+\.[0-9]+(\.[0-9]+)?) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "### Detected version: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "### No version tag found in commit message" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-extension:
    needs: check-version
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/dist/

      - name: Upload extension source artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-src
          path: |
            extension/
            !extension/node_modules/
            !extension/dist/
            !extension/package-lock.json

  build-linux:
    needs: [check-version, build-extension]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Build .deb package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot
          VERSION=${{ needs.check-version.outputs.version }} bash ./linux/build.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb

  build-windows:
    needs: [check-version, build-extension]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Build Windows package
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p build/aurora-browser-${VERSION}-win/extension
          mkdir -p build/aurora-browser-${VERSION}-win/profile

          cp -r extension/dist build/aurora-browser-${VERSION}-win/extension/dist
          cp extension/aurora.png build/aurora-browser-${VERSION}-win/extension/aurora.png
          cp windows/update.ps1 build/aurora-browser-${VERSION}-win/
          cp aurora.png build/aurora-browser-${VERSION}-win/
          echo 'REPO="Draftiermovie66/Aurora-Browser"' > build/aurora-browser-${VERSION}-win/update.conf
          echo "CHROMIUM_VERSION=0" > build/aurora-browser-${VERSION}-win/version.txt

          mcs -out:build/aurora-browser-${VERSION}-win/aurora-browser.exe \
            -target:winexe \
            -r:System.dll \
            windows/src/AuroraBrowser.cs

          echo "Compiled aurora-browser.exe"

      - name: Create Windows zip
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          cd build
          zip -r "../aurora-browser-${VERSION}-win.zip" "aurora-browser-${VERSION}-win"

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: aurora-browser-${{ needs.check-version.outputs.version }}-win.zip

  build-arch:
    needs: check-version
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot
          bash ./linux/build.sh
          ls -la *.deb

      - name: Upload Arch PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: arch-pkgbuild
          path: linux/arch/PKGBUILD

  create-release:
    needs: [check-version, build-linux, build-windows, build-arch]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Download Arch PKGBUILD
        uses: actions/download-artifact@v4
        with:
          name: arch-pkgbuild

      - name: Rename PKGBUILD
        run: mv PKGBUILD aurora-browser-PKGBUILD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Aurora Browser ${{ needs.check-version.outputs.tag }}
          body: |
            ## Aurora Browser ${{ needs.check-version.outputs.tag }}

            ${{ github.event.head_commit.message }}

            **Ubuntu/Debian:**
            ```
            sudo dpkg -i aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb
            ```

            **Arch Linux:** Build with makepkg using aurora-browser-PKGBUILD, or install via debtap.

            **Windows:** Extract zip, run `update.ps1`, launch `aurora-browser.exe`
          files: |
            aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb
            aurora-browser-${{ needs.check-version.outputs.version }}-win.zip
            aurora-browser-PKGBUILD
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
