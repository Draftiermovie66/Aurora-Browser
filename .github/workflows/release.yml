name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      has_version: ${{ steps.check.outputs.has_version }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version from commit message
        id: check
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          if [[ "$MSG" =~ [Vv]([0-9]+\.[0-9]+(\.[0-9]+)?) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "### Detected version: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "### No version tag found in commit message" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-extension:
    needs: check-version
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/dist/

  build-deb:
    needs: [check-version, build-extension]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Build .deb package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot
          VERSION=${{ needs.check-version.outputs.version }} bash ./linux/debian/build.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb

  build-appimage:
    needs: [check-version, build-extension]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Build AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y file libfuse2 desktop-file-utils imagemagick
          VERSION=${{ needs.check-version.outputs.version }} bash ./linux/appimage/build.sh

      - name: List AppImage output
        run: ls -la build/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/Aurora-Browser-*.AppImage

  build-rpm:
    needs: [check-version, build-extension]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM
        run: |
          VERSION=${{ needs.check-version.outputs.version }} bash ./linux/redhat/build.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: build/aurora-browser-*.rpm

  build-windows:
    needs: [check-version, build-extension]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Build Windows package
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p build/aurora-browser-${VERSION}-win/extension
          mkdir -p build/aurora-browser-${VERSION}-win/profile

          cp -r extension/dist build/aurora-browser-${VERSION}-win/extension/dist
          cp extension/aurora.png build/aurora-browser-${VERSION}-win/extension/aurora.png
          cp windows/update.ps1 build/aurora-browser-${VERSION}-win/
          cp aurora.png build/aurora-browser-${VERSION}-win/
          echo 'REPO="Draftiermovie66/Aurora-Browser"' > build/aurora-browser-${VERSION}-win/update.conf
          echo "CHROMIUM_VERSION=0" > build/aurora-browser-${VERSION}-win/version.txt

          mcs -out:build/aurora-browser-${VERSION}-win/aurora-browser.exe \
            -target:winexe \
            -r:System.dll \
            windows/src/AuroraBrowser.cs

          echo "Compiled aurora-browser.exe"

      - name: Copy standalone Windows .exe
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          cp build/aurora-browser-${VERSION}-win/aurora-browser.exe \
             aurora-browser-${VERSION}-win.exe
          ls -la aurora-browser-${VERSION}-win.exe

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: aurora-browser-${{ needs.check-version.outputs.version }}-win.exe

  build-arch:
    needs: check-version
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Arch PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: arch-pkgbuild
          path: linux/arch/PKGBUILD

  build-macos:
    needs: [check-version, build-extension]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React extension
        working-directory: extension
        run: |
          npm install
          npm run build

      - name: Build macOS BETA app + dmg
        run: |
          VERSION=${{ needs.check-version.outputs.version }} bash ./macos/build.sh

      - name: List macOS output
        run: ls -la build/macos build/*.dmg

      - name: Upload macOS BETA artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/macos/
            build/Aurora-Browser-*.dmg

  create-release:
    needs: [check-version, build-deb, build-appimage, build-rpm, build-windows, build-arch, build-macos]
    if: needs.check-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage

      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm

      - name: Download Windows .exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Download Arch PKGBUILD
        uses: actions/download-artifact@v4
        with:
          name: arch-pkgbuild

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos

      - name: Rename PKGBUILD
        run: mv PKGBUILD aurora-browser-PKGBUILD

      - name: Make AppImage executable
        run: chmod +x Aurora-Browser-*.AppImage

      - name: List release assets
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Aurora Browser ${{ needs.check-version.outputs.tag }}
          body: |
            ## Aurora Browser ${{ needs.check-version.outputs.tag }}

            ${{ github.event.head_commit.message }}

            ### Downloads

            **Linux:**
            - Ubuntu/Debian/Mint: `aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb`
            - Fedora/RHEL/CentOS: `aurora-browser-${{ needs.check-version.outputs.version }}-1.x86_64.rpm`
            - Arch/Manjaro: `aurora-browser-PKGBUILD`
            - Universal: `Aurora-Browser-${{ needs.check-version.outputs.version }}-x86_64.AppImage`

            **Windows:**
            - `aurora-browser-${{ needs.check-version.outputs.version }}-win.exe`

            **macOS (BETA):**
            - `Aurora-Browser-${{ needs.check-version.outputs.version }}-BETA.dmg`

            ### Install
            **Ubuntu/Debian:**
            ```
            sudo dpkg -i aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb
            ```

            **AppImage (any Linux):**
            ```
            chmod +x Aurora-Browser-*.AppImage && ./Aurora-Browser-*.AppImage
            ```

            **Windows:** Download the `.exe` (place it in a folder alongside `update.ps1`, the `extension/` dir, and a `chrome-win/` engine dir), launch `aurora-browser.exe`

            **macOS BETA:** Open DMG, drag Aurora Browser to Applications
          files: |
            aurora-browser_${{ needs.check-version.outputs.version }}_amd64.deb
            Aurora-Browser-${{ needs.check-version.outputs.version }}-x86_64.AppImage
            aurora-browser-${{ needs.check-version.outputs.version }}-1.x86_64.rpm
            aurora-browser-${{ needs.check-version.outputs.version }}-win.exe
            aurora-browser-PKGBUILD
            Aurora-Browser-${{ needs.check-version.outputs.version }}-BETA.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
