name: Package Check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  validate-scripts:
    name: Validate build scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate engine build scripts
        run: |
          bash -n engine/build.sh && echo "OK: engine/build.sh"
          bash -n engine/brand.sh && echo "OK: engine/brand.sh"
          bash -n engine/package.sh && echo "OK: engine/package.sh"
          bash -n engine/sign.sh && echo "OK: engine/sign.sh"
          bash -n engine/checksums.sh && echo "OK: engine/checksums.sh"

      - name: Validate installer build script
        run: |
          bash -n installer/build.sh && echo "OK: installer/build.sh"

      - name: Validate CI/release workflows
        run: |
          bash -n scripts/build/build.sh && echo "OK: scripts/build/build.sh"

  validate-version:
    name: Validate VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION format
        run: |
          VER=$(cat VERSION | tr -d ' \n\r')
          echo "VERSION=$VER"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VER' does not match X.Y.Z pattern"
            exit 1
          fi
          echo "Version format OK"

  validate-workflows:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          pip install yamllint 2>/dev/null || true
          for f in .github/workflows/*.yml; do
            echo "--- Checking $f ---"
            yamllint -d relaxed "$f" 2>/dev/null || python3 -c "
          import yaml, sys
          try:
              yaml.safe_load(open('$f'))
              print('YAML OK: $f')
          except Exception as e:
              print(f'YAML ERROR: $f: {e}')
              sys.exit(1)
          "
          done
