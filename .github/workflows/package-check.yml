name: Package Check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-scripts:
    name: Validate build scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate engine scripts
        run: |
          set -euo pipefail
          FAIL=0
          for f in engine/*.sh; do
            if bash -n "$f" 2>/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Script syntax errors found"
            exit 1
          fi

      - name: Validate installer build script
        run: |
          bash -n installer/build.sh && echo "OK: installer/build.sh"

      - name: Validate build orchestrator
        run: |
          bash -n scripts/build/build.sh && echo "OK: scripts/build/build.sh"

      - name: Check scripts are executable
        run: |
          set -euo pipefail
          FAIL=0
          for f in engine/*.sh installer/build.sh scripts/build/build.sh; do
            if [ -x "$f" ]; then
              echo "OK (executable): $f"
            else
              echo "WARN: $f is not executable"
              chmod +x "$f"
              echo "  Fixed: made $f executable"
            fi
          done

  validate-version:
    name: Validate VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check VERSION format
        run: |
          set -euo pipefail
          VER=$(cat VERSION | tr -d ' \n\r')
          echo "VERSION=$VER"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VER' does not match X.Y.Z pattern"
            exit 1
          fi
          echo "Version format OK"

  validate-workflows:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check YAML syntax
        run: |
          set -euo pipefail
          python3 -c "
          import yaml, sys, glob
          ok = True
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f))
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  ok = False
          if not ok:
              sys.exit(1)
          print('All workflow YAML files valid')
          "

  validate-newtab:
    name: Validate newtab page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check newtab HTML exists
        run: |
          if [ -f engine/newtab/index.html ]; then
            echo "OK: engine/newtab/index.html exists"
          else
            echo "::error::engine/newtab/index.html missing"
            exit 1
          fi

      - name: Validate HTML
        run: |
          python3 -c "
          import re
          with open('engine/newtab/index.html') as f:
              html = f.read()
          if '<html' in html.lower() and '</html>' in html.lower():
              print('OK: HTML structure valid')
          else:
              print('WARN: HTML structure may be incomplete')
          "
