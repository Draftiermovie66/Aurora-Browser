name: Package Check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  validate-scripts:
    name: Validate build scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate engine build scripts
        run: |
          set -e
          for f in engine/build.sh engine/brand.sh engine/package.sh engine/sign.sh engine/checksums.sh; do
            bash -n "$f" && echo "OK: $f"
          done

      - name: Validate installer build script
        run: |
          bash -n installer/build.sh && echo "OK: installer/build.sh"

      - name: Validate build orchestrator
        run: |
          bash -n scripts/build/build.sh && echo "OK: scripts/build/build.sh"

  validate-version:
    name: Validate VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION format
        run: |
          VER=$(cat VERSION | tr -d ' \n\r')
          echo "VERSION=$VER"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VER' does not match X.Y.Z pattern"
            exit 1
          fi
          echo "Version format OK"

  validate-workflows:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          python3 -c "
          import yaml, sys, glob
          ok = True
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f))
                  print('OK: ' + f)
              except Exception as e:
                  print('FAIL: ' + f + ': ' + str(e))
                  ok = False
          if not ok:
              sys.exit(1)
          "
